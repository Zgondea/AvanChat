# alembic.ini
[alembic]
# Path to migration scripts
script_location = alembic

# Template for naming new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Set timezone for autogenerate timestamps
timezone = utc

# DB connection string
# Recomandare: folosește variabila de mediu DATABASE_URL
# Dacă nu, pune direct URL-ul aici:
# sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/avanchat
sqlalchemy.url = postgresql+psycopg2://postgres:postgres123@localhost:5432/chat_legislativ

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
